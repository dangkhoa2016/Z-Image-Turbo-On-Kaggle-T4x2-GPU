name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'fastapi>=0.115' 'pydantic>=2' 'numpy>=2' 'pillow>=10' 'pytest>=8' 'httpx>=0.27'

      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Verify curated evidence
        env:
          PYTHONPATH: src
        run: |
          python scripts/api_contract_acceptance.py
          git diff --exit-code -- evidence/api-contract-status-codes.json
          python scripts/verify_evidence.py

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Validate shell syntax
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: Verify production notebook statically
        env:
          PYTHONPATH: src
        run: python scripts/verify_notebook_static.py notebooks/kaggle-t4x2-rest-server-production.ipynb

      - name: Reject runtime artifacts and obvious credentials
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.runtime|outputs|metadata|logs)(/|$)|(^|/)api_token$|\.pid$|tunnel_url$|cloudflared$|\.tar$|\.tar\.gz$|\.sha256$|(^|/)build(/|$)|\.egg-info(/|$)'; then
            echo 'Forbidden runtime artifact is tracked.' >&2
            exit 1
          fi
          if git grep -nE 'github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' -- . ':!README.md' ':!README.vi.md'; then
            echo 'Possible credential material found.' >&2
            exit 1
          fi
